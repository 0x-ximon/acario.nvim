name-template: "Acario.nvim v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Major Changes"
    semver-increment: "major"
    when:
      labels:
        - "major"

  - title: "Minor Changes"
    semver-increment: "minor"
    when:
      labels:
        - "minor"
        - "feature"

  - title: "Improvements"
    semver-increment: "patch"
    when:
      labels:
        - "patch"
        - "fix"
        - "performance"
        - "maintenance"

  - title: "Miscellaneous"

  - type: "pre-exclude"
    when:
      labels:
        - "invalid"
        - "ignored"

template: |
  $CHANGES

change-template: "- $TITLE ([#$NUMBER]($URL)) by @$AUTHOR"
